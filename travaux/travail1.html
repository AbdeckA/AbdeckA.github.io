<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modulo</title>
  <script>
    function confirmeInscription() {
      var n1 = document.getElementById("nombre1").value;
      var n2 = document.getElementById("nombre2").value;

      // Convert inputs to numbers before doing modulo
      var num1 = parseFloat(n1);
      var num2 = parseFloat(n2);

      if (isNaN(num1) || isNaN(num2)) {
        document.getElementById("reponse").innerHTML = "<h2>Veuillez entrer des nombres valides.</h2>";
      } else {
        var result = num1 % num2;
        document.getElementById("reponse").innerHTML = "<p>" + num1 + " % " + num2 + " = " + result + "</p>";
      }
    }
  </script>
</head>
<body>
  <h1>Programme Modulo</h1>
  <label for="nombre1">Nombre 1:</label>
  <input type="text" id="nombre1">
  <br><br>
  <label for="nombre2">Nombre 2:</label>
  <input type="text" id="nombre2">
  <br><br>
  <input type="button" id="btnSoumet" onclick="confirmeInscription()" value="Soumettre">
  <p id="reponse"></p>
</body>
</html>

Travail 2
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Travaille 2</title>
  <script>
    function Initiales() {
        nom = document.getElementById("noms").value.split(" ")
        initials = ""
        for (let i = 0; i<nom.length; i++) {
            initials += nom[i].slice(0, 1).toUpperCase() + "."
        }
        username = ""
        for (let i = 0; i<nom.length-1; i++) {
            username += nom[i].slice(0, 1).toLowerCase()
        }
        
        document.getElementById("initiales").innerHTML = "Initiales: " + initials;
        document.getElementById("nomComplete").innerHTML = "Nom Complete: " + nom.join(" ");
        document.getElementById("nomUtilisateur").innerHTML = "Nom d'utilisateur: " + username + nom[nom.length-1];
    }
  </script>
</head>
<body>
  <h1>Travaille 2</h1>
  <label for="noms">Nom complet:</label>
  <input type="text" id="noms">
  <br><br>
  <input type="button" id="btnSoumet" onclick="Initiales()" value="Soumettre">
  <p id="initiales"></p>
  <p id="nomComplete"></p>
  <p id="nomUtilisateur"></p>
</body>
</html>
